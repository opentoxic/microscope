name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: go
            working-directory: adaptor/go
            setup: go
            command: go test ./...
          - name: php
            working-directory: adaptor/php
            setup: php
            command: composer install --no-interaction && composer test
          - name: python
            working-directory: adaptor/python
            setup: python
            command: pip install -e .[dev] && python -m pytest
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4

      - name: Sync core assets
        run: sh scripts/sync-core-assets.sh

      - uses: actions/setup-go@v5
        if: matrix.setup == 'go'
        with:
          go-version: "1.25.x"

      - uses: shivammathur/setup-php@v2
        if: matrix.setup == 'php'
        with:
          php-version: "8.3"
          extensions: pdo_pgsql
          tools: composer

      - uses: actions/setup-python@v5
        if: matrix.setup == 'python'
        with:
          python-version: "3.12"

      - name: Test
        working-directory: ${{ matrix.working-directory }}
        run: ${{ matrix.command }}
