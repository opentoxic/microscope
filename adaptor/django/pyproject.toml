[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "opentoxic-microscope-adaptor-django"
version = "0.1.0"
description = "Django adaptor for microscope observability"
requires-python = ">=3.10"
dependencies = [
    "django>=4.2",
    "psycopg[binary]>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-django>=4.8", "opentoxic-microscope-adaptor-python"]

[tool.hatch.build.targets.wheel]
packages = ["microscope_django"]
