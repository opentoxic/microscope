[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "opentoxic-microscope-adaptor-python"
version = "0.1.0"
description = "Native Python adaptor for microscope observability"
requires-python = ">=3.10"
dependencies = [
    "psycopg[binary]>=3.1",
]

[project.optional-dependencies]
asgi = ["starlette>=0.37", "uvicorn>=0.27"]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.hatch.build.targets.wheel]
packages = ["microscope"]

[tool.pytest.ini_options]
testpaths = ["tests"]
