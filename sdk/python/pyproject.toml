[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "microscope-client"
version = "0.1.0"
description = "Thin HTTP client for the microscope observability API"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["requests>=2.28"]

[project.optional-dependencies]
django = ["django>=4.2"]
fastapi = ["starlette>=0.30"]
test = ["django>=4.2", "starlette>=0.30", "httpx>=0.24"]

[project.urls]
Homepage = "https://github.com/qobly/microscope"

[tool.setuptools.packages.find]
where = ["."]
include = ["microscope_client*"]
